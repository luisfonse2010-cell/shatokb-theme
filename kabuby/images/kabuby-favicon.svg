<?xml version="1.0" encoding="UTF-8"?>
<!-- Favicon version - simplificado para 32x32 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f1a35"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </radialGradient>
    <filter id="g">
      <feGaussianBlur stdDeviation="0.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>

  <!-- Cuerpo del camello - versión compacta -->
  <!-- Cuerpo -->
  <polygon points="6,24 8,18 12,16 20,16 24,18 25,24 20,25 12,25" fill="#6c8eff" filter="url(#g)"/>
  <!-- Faceta cuerpo -->
  <polygon points="6,24 8,18 10,21" fill="#8ba8ff" opacity="0.5"/>
  <polygon points="20,16 24,18 22,20" fill="#5070dc" opacity="0.6"/>

  <!-- Joroba trasera -->
  <polygon points="10,16 13,10 16,9 17,16" fill="#6c8eff" filter="url(#g)"/>
  <polygon points="10,16 13,10 11.5,13" fill="#8ba8ff" opacity="0.45"/>

  <!-- Joroba delantera -->
  <polygon points="16,16 18,11 20,10 21,16" fill="#6c8eff" filter="url(#g)"/>
  <polygon points="16,16 18,11 17,13.5" fill="#8ba8ff" opacity="0.45"/>

  <!-- Cuello -->
  <polygon points="21,16 23,12 26,11 27,16 24,18" fill="#6c8eff" filter="url(#g)"/>

  <!-- Cabeza -->
  <polygon points="23,12 26,9 29,10 29,14 27,16 23,14" fill="#6c8eff" filter="url(#g)"/>
  <polygon points="23,12 26,9 24,11" fill="#8ba8ff" opacity="0.4"/>
  <polygon points="29,10 29,14 28,12" fill="#5070dc" opacity="0.5"/>

  <!-- Hocico -->
  <polygon points="27,13 29,12 30,14 28,15" fill="#4a6fe8"/>

  <!-- Oreja -->
  <polygon points="24,9 26,6 27,9 25,10" fill="#6c8eff"/>

  <!-- Ojo verde -->
  <circle cx="27" cy="11" r="1.5" fill="#34d399" filter="url(#g)"/>
  <circle cx="27" cy="11" r="0.8" fill="#0b1120"/>
  <circle cx="27" cy="11" r="0.4" fill="#34d399"/>

  <!-- Patas -->
  <rect x="8" y="25" width="2" height="4" rx="0.5" fill="#4a6fe8"/>
  <rect x="11" y="25" width="2" height="4" rx="0.5" fill="#5070dc"/>
  <rect x="18" y="25" width="2" height="4" rx="0.5" fill="#4a6fe8"/>
  <rect x="21" y="25" width="2" height="4" rx="0.5" fill="#5070dc"/>

  <!-- Destello en joroba -->
  <circle cx="18.5" cy="11" r="0.8" fill="white" opacity="0.5"/>

  <!-- Punto verde decorativo -->
  <circle cx="4" cy="8" r="1" fill="#34d399" opacity="0.6"/>
</svg>
