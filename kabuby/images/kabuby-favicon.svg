<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fondo marino redondeado -->
  <rect width="64" height="64" rx="14" fill="#0b1120"/>
  <!-- Círculo exterior brújula -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#6c8eff" stroke-width="3"/>
  <circle cx="32" cy="32" r="20" fill="#0f1d35"/>
  <!-- Ticks cardinales -->
  <line x1="32" y1="10" x2="32" y2="15" stroke="#6c8eff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="49" x2="32" y2="54" stroke="#6c8eff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="32" x2="15" y2="32" stroke="#6c8eff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="49" y1="32" x2="54" y2="32" stroke="#6c8eff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Aguja Norte (roja/acento) -->
  <polygon points="32,14 29,32 35,32" fill="#34d399"/>
  <!-- Aguja Sur -->
  <polygon points="32,50 29,32 35,32" fill="#6c8eff" opacity="0.6"/>
  <!-- Centro -->
  <circle cx="32" cy="32" r="3" fill="#6c8eff"/>
  <circle cx="32" cy="32" r="1.5" fill="#34d399"/>
</svg>
