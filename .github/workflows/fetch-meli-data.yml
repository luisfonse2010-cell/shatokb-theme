name: Legacy MeLi data archival guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserve-history-without-refresh:
    name: Preserve historical source without operational refresh
    runs-on: ubuntu-latest
    steps:
      - name: Explain the safety boundary
        run: |
          echo "Legacy MeLi JSON is archival only."
          echo "No provider call, repository write, or Pages-triggering data commit is performed."
