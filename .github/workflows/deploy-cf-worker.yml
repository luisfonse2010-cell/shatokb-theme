name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'cloudflare-worker.js'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install Wrangler
        run: npm install -g wrangler
      - name: Crear wrangler.toml
        run: |
          printf 'name = "koi-proxy"\n' > wrangler.toml
          printf 'main = "cloudflare-worker.js"\n' >> wrangler.toml
          printf 'compatibility_date = "2024-01-01"\n' >> wrangler.toml
          printf 'account_id = "%s"\n' "${{ secrets.CF_ACCOUNT_ID }}" >> wrangler.toml
          echo "--- wrangler.toml ---"
          cat wrangler.toml
      - name: Deploy a Cloudflare
        run: wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
