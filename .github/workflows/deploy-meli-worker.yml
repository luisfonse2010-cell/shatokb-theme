name: Deploy MELI Connector Worker

on:
  push:
    branches:
      - main
    paths:
      - 'shato-meli-connector/worker.js'
      - 'shato-meli-connector/wrangler-meli.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install Wrangler
        run: npm install -g wrangler
      - name: Deploy shato-meli-connector
        run: wrangler deploy --config shato-meli-connector/wrangler-meli.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
