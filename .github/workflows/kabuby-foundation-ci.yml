name: Kabuby Pages foundation certification

on:
  pull_request:
    paths:
      - 'kabuby/today/**'
      - 'kabuby/**'
      - 'test/**'
      - '.github/workflows/kabuby-foundation-ci.yml'
      - '.github/workflows/deploy-kabuby.yml'
  push:
    branches: [main]
    paths:
      - 'kabuby/today/**'
      - 'kabuby/**'
      - 'test/**'
      - '.github/workflows/kabuby-foundation-ci.yml'
      - '.github/workflows/deploy-kabuby.yml'

permissions:
  contents: read

jobs:
  foundation-certification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: Enforce immutable Scout baseline and scope boundary
        env:
          SCOUT_GATE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/scout-protection-gate.mjs --base "$SCOUT_GATE_BASE"
      - name: Enforce production safety envelope and declared scope
        env:
          RELEASE_GATE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/production-safety-envelope-gate.mjs --base "$RELEASE_GATE_BASE"
      - name: Run static frontend certification
        run: node --test test/*.test.mjs
      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD
